name: QuranRoots CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true

      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Quran content integrity validation
        # Explicitly sourced from the VITE_ pair, not the job-wide bare
        # SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY above: src/integrations/
        # supabase/client.ts itself prefers VITE_SUPABASE_* first, and
        # DEPLOYMENT.md documents the bare pair as Cloudflare Worker runtime
        # config, not a value this GitHub Actions workflow's secret of the
        # same name is guaranteed to keep in sync with. Step-scoped so the
        # job-wide env (and therefore build/E2E) is untouched.
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run validate:quran-content

      - name: Build
        run: npm run build

      # --- E2E tests run against an isolated, ephemeral local Supabase
      # stack, not the remote project VITE_SUPABASE_URL/SUPABASE_URL above
      # point at. Root-caused after CI run #112: that remote project is the
      # SAME one baked into the production client bundle (confirmed by
      # inspecting the live production JS bundle directly, and documented
      # in DEPLOYMENT.md as the same secret production-deploy.yml uses to
      # build that bundle) -- i.e. the E2E suite was running against
      # production's own database, isolated only by RLS around one shared
      # test account, not by a genuinely separate database. Applying an
      # unreviewed migration (or any migration) there to fix a failing
      # test would mean applying it to production, which is exactly what
      # must never happen from this workflow. `supabase start` here spins
      # up a throwaway Postgres/GoTrue/PostgREST stack inside this runner
      # only, seeded from supabase/migrations/ in order (all of them,
      # including new ones a PR adds) -- fully reproducible, and destroyed
      # with the runner.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start local Supabase (applies every migration, including new ones)
        run: supabase start

      # CI run #113 failed here: .env.test is gitignored (deliberately --
      # it holds a real test account's plaintext password for local dev),
      # so checkout never brings it onto the runner, and the bootstrap
      # script's readEnvTest() hit ENOENT. Fixed by generating .env.test
      # here instead of assuming it exists -- URL/anon key read from this
      # run's own local stack (never hardcoded, so they can never drift
      # from whatever port/instance actually started), and a fresh,
      # random, disposable email+password created for this run only, that
      # exists solely in this throwaway local stack -- never the shared
      # local-dev test account and never any production credential. Never
      # echoed: captured straight into the file, no intermediate print.
      # Values written unquoted -- ensure-local-test-user.mjs's own
      # .env.test parser is a plain KEY=value regex with no quote
      # stripping (unlike dotenv, which both this file's other consumers
      # use), so a quoted value here would be read back literally with
      # the quote characters still attached.
      # PR #39's CI run failed here in a different way: the Playwright web
      # server (src/lib/billing/supabaseAdmin.ts's getSupabaseAdminClient)
      # reads the *bare* SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY pair
      # server-side -- never the VITE_-prefixed pair, which is browser-only
      # -- so GET /api/billing/status 500'd with "Missing required
      # environment variable(s): SUPABASE_SERVICE_ROLE_KEY" the moment
      # 61-settings-billing-routing.spec.ts exercised it, even though the
      # route itself (this PR's actual fix) was rendering correctly. Now
      # every server-side var this app's billing code reads is sourced
      # from this same disposable local stack too, alongside the existing
      # VITE_ pair -- never the job-wide `secrets.SUPABASE_*` above, which
      # (per the block comment on "Start local Supabase" further up) is
      # the same production project baked into the production bundle.
      - name: Create local .env.test (disposable credentials, local stack only)
        run: |
          set -euo pipefail
          STATUS="$(supabase status -o env)"
          API_URL="$(printf '%s\n' "$STATUS" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')"
          ANON_KEY="$(printf '%s\n' "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
          SERVICE_ROLE_KEY="$(printf '%s\n' "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')"

          if [[ "$API_URL" != http://127.0.0.1:* && "$API_URL" != http://localhost:* ]]; then
            echo "::error::supabase status resolved API_URL to a non-local address -- refusing to write .env.test."
            exit 1
          fi

          if [[ -z "$SERVICE_ROLE_KEY" ]]; then
            echo "::error::supabase status did not return a SERVICE_ROLE_KEY -- refusing to write .env.test."
            exit 1
          fi

          DISPOSABLE_EMAIL="e2e-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          DISPOSABLE_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$DISPOSABLE_PASSWORD"

          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_TEST_EMAIL=$DISPOSABLE_EMAIL"
            echo "E2E_TEST_PASSWORD=$DISPOSABLE_PASSWORD"
          } > .env.test

          echo "Wrote .env.test for the local stack at $API_URL (values not printed)."

      - name: Bootstrap the local E2E test account
        run: |
          set -a
          source .env.test
          set +a
          npm run test:e2e:setup

      # Defense in depth, independent of the check inside the step above:
      # re-resolves both the browser-side (VITE_SUPABASE_URL) and
      # server-side (SUPABASE_URL) URLs from .env.test one more time, right
      # before Playwright can do anything with them, and refuses to
      # proceed if either is not localhost -- or if SUPABASE_SERVICE_ROLE_KEY
      # (which the billing API route needs server-side, see the "Create
      # local .env.test" step above) is missing. The key's value is never
      # printed, only its presence.
      - name: Verify E2E target is localhost (fail-fast)
        run: |
          set -a
          source .env.test
          set +a
          if [[ "$VITE_SUPABASE_URL" != http://127.0.0.1:* && "$VITE_SUPABASE_URL" != http://localhost:* ]]; then
            echo "::error::VITE_SUPABASE_URL (\"$VITE_SUPABASE_URL\") is not localhost -- refusing to run E2E tests."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != http://127.0.0.1:* && "$SUPABASE_URL" != http://localhost:* ]]; then
            echo "::error::SUPABASE_URL (\"$SUPABASE_URL\") is not localhost -- refusing to run E2E tests."
            exit 1
          fi
          if [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing -- refusing to run E2E tests."
            exit 1
          fi
          echo "Confirmed E2E target is localhost and the service-role key is present."

      - name: Run E2E tests
        run: |
          set -a
          source .env.test
          set +a
          npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
