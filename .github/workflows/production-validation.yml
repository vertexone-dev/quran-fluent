name: Production Validation

on:
  workflow_dispatch: {}
  # Allows this workflow to be invoked as a post-deployment validation step
  # from the production deployment workflow (.github/workflows/production-
  # deploy.yml) via `uses: ./.github/workflows/production-validation.yml` +
  # `secrets: inherit`. No inputs/secrets are declared here on purpose --
  # `secrets: inherit` passes the caller's secrets through under their
  # existing names, so every `secrets.*` reference below keeps working
  # unchanged for both trigger types. Manual `workflow_dispatch` behavior is
  # completely unchanged by this addition.
  workflow_call: {}

jobs:
  production-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      PLAYWRIGHT_BASE_URL: https://quranroots.vertexone.workers.dev

      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Quran content integrity validation (strict — Kazimirski corpus required)
        # Explicitly sourced from the VITE_ pair -- see the matching comment
        # in ci.yml. Step-scoped so the job-wide env (and therefore the E2E
        # suites below, which intentionally use both pairs for their own
        # purposes) is untouched.
        env:
          REQUIRE_KAZIMIRSKI_SOURCE: "true"
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run validate:quran-content

      - name: Run targeted E2E (specs 17-35, 37-41) against production
        # No --reporter override: falls back to playwright.config.ts's own
        # CI default (html + list), matching ci.yml's convention -- this is
        # what makes an HTML report exist to upload as an artifact below.
        # Which specs run, and their pass/fail semantics, are unchanged.
        run: >
          npx playwright test
          tests/e2e/17-lesson-player.spec.ts
          tests/e2e/18-level1-pilot.spec.ts
          tests/e2e/19-level1-module2.spec.ts
          tests/e2e/20-level1-module2-chunk2.spec.ts
          tests/e2e/21-lesson-review-integration.spec.ts
          tests/e2e/22-placement-curriculum.spec.ts
          tests/e2e/23-daily-learning-plan.spec.ts
          tests/e2e/24-practice-concept-review.spec.ts
          tests/e2e/25-level1-module3-harakat.spec.ts
          tests/e2e/26-level1-module4-sukun-shadda.spec.ts
          tests/e2e/27-level1-module5-tanwin.spec.ts
          tests/e2e/28-level1-module6-connected-letter-forms.spec.ts
          tests/e2e/29-level1-module7-first-reading-practice.spec.ts
          tests/e2e/30-level1-module8-reading-al-fatiha.spec.ts
          tests/e2e/31-level1-release-journey.spec.ts
          tests/e2e/32-level2-batch1-vocabulary-and-orthography.spec.ts
          tests/e2e/33-level2-batch2-core-vocabulary-2-and-short-phrases.spec.ts
          tests/e2e/34-level2-batch3-vocabulary-capstone.spec.ts
          tests/e2e/35-level2-release-journey.spec.ts
          tests/e2e/37-level3-batch1-arabic-roots-intro-and-word-patterns.spec.ts
          tests/e2e/38-level3-batch2-roots-capstone.spec.ts
          tests/e2e/39-level3-release-journey.spec.ts
          tests/e2e/40-level4-batch1-pronouns-and-agreement.spec.ts
          tests/e2e/41-level4-batch2-grammar-capstone.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-test-results
          path: test-results/
          retention-days: 7

      # Separate step (not folded into the run above) so a failure here is
      # attributed clearly and visibly to the Quran content release gate,
      # not buried inside the 25-spec learning-path run. `if: always()`
      # means it still runs -- and can still fail the job -- even if the
      # learning-path suite above already failed; Phase 8B.4 requires a
      # smoke-test failure to fail the workflow visibly, not be skipped.
      - name: Run production Quran Reader smoke suite (spec 51)
        if: always()
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-quran-smoke
        run: npx playwright test tests/e2e/51-production-quran-smoke.spec.ts

      - name: Upload Quran smoke suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-quran-smoke-report
          path: playwright-report-quran-smoke/
          retention-days: 7

      # 15-full-dataset.spec.ts was never part of any automated pipeline
      # against real production data before this step: it isn't in the
      # specs 17-41 learning-path list above (it predates/is unrelated to
      # curriculum progression), and ci.yml only ever runs it against
      # local/CI-dev, which never has the certified Kazimirski corpus (see
      # that spec's own test.skip guard). Separate step, same reasoning as
      # spec 51 above: a failure here is attributed clearly to the
      # full-dataset/translation-coverage gate, not buried elsewhere.
      # `if: always()` so it still runs -- and can still fail the job --
      # even if an earlier step already failed. PLAYWRIGHT_BASE_URL is
      # already set for the whole job (see this workflow's `env:` block
      # above), so the French-Kazimirski test's own environment guard does
      # NOT skip here -- it runs its real assertions against the deployed
      # Worker's live, governed French translation data.
      - name: Run production full-dataset validation (spec 15)
        if: always()
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-full-dataset
        run: npx playwright test tests/e2e/15-full-dataset.spec.ts

      - name: Upload full-dataset validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-full-dataset-report
          path: playwright-report-full-dataset/
          retention-days: 7

      # Authenticated Level 6 production validation (fix/level6-production-
      # validation): the curated "specs 17-35, 37-41" list above predates
      # Level 6 and was never extended for it, so Production Validation #18
      # never exercised the live, deployed Level 6 module at all. A
      # dedicated, narrower spec -- not 58 itself, which has two tests that
      # are unsafe to run standalone against the shared production account
      # (see that spec's own file header and this file's PR description) --
      # covering gating (via the real placement flow, never faked), all
      # three lessons, EN/FR content, RTL Arabic, exercise grading, resume,
      # RLS write-scoping, and three viewports. Separate step, same
      # `if: always()` reasoning as specs 51/15 above -- a Level 6
      # regression is attributed clearly to this gate and still fails the
      # job even if an earlier step already failed.
      - name: Run Level 6 production validation (spec 60)
        if: always()
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-level6
        run: npx playwright test tests/e2e/60-level6-production-validation.spec.ts

      - name: Upload Level 6 production validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-level6-report
          path: playwright-report-level6/
          retention-days: 7

      # Confirmed defect: X-Content-Type-Options, X-Frame-Options,
      # Referrer-Policy and Permissions-Policy were present on /assets/*
      # but absent from /, /quran, /learn and HTML 404 responses -- fixed
      # by src/server.ts's withSecurityHeaders (commit a61f566). This step
      # is that fix's live proof: it asserts the exact required header
      # values on real responses from the deployed Worker itself, not just
      # in code review. Separate step, same `if: always()` reasoning as
      # specs 15/51 above -- a header regression is attributed clearly to
      # this gate and still fails the job even if an earlier step already
      # failed. No PLAYWRIGHT_BASE_URL/Playwright dependency: this is a
      # plain Node script (global fetch, Node 22) that never sends a
      # credential and only ever prints route names, header names and the
      # header/status values themselves.
      - name: Run production security header validation
        if: always()
        run: node scripts/validate-production-headers.mjs
